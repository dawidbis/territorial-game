<!doctype html>
<html lang="pl">
  <head>
    <meta charset="utf-8" />
    <title>Client</title>
    <base href="/" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" type="image/x-icon" href="favicon.ico" />

    <style>
      /*
        Ekran startowy ma wyglądać poprawnie przy PIERWSZYM malowaniu, a arkusz aplikacji
        przychodzi dopiero po nim. Stąd style tutaj, a nie klasy Tailwinda: przez te
        kilkaset milisekund splash byłby inaczej czarnym tekstem na białym tle — czyli
        dokładnie tym mignięciem, którego ma nie być.

        Kolory wpisane wprost z motywu `crt` (styles.css): tło base-100, treść primary.
        Wersja szesnastkowa stoi przed oklch dla przeglądarek, które go nie znają.
      */
      #initial-splash {
        position: fixed;
        inset: 0;

        /*
          Powyżej nakładek kineskopu (z-index 55 i 60). Ekran ładowania ma być jednym
          obrazem, a nie tłem, przez które prześwituje montaż aplikacji.
        */
        z-index: 70;

        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.5rem;

        /*
          Nieprzezroczyste tło jest tu całym sensem. Bez niego aplikacja renderuje się
          widocznie POD ekranem ładowania i gracz ogląda, jak się składa.
        */
        background-color: #000000;
        background-color: oklch(0% 0 0);

        color: #6ee7a8;
        color: oklch(83% 0.21 148);

        font-family: ui-monospace, "Cascadia Mono", "Consolas", monospace;
        text-shadow: 0 0 0.35em currentColor;
      }

      #initial-splash svg {
        width: 8rem;
        height: 8rem;
      }

      #initial-splash p {
        margin: 0;
        font-size: 3rem;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <div id="initial-splash" role="status">
      <svg
        xmlns="http://www.w3.org/2000/svg"
        fill="none"
        viewBox="0 0 24 24"
        stroke-width="1.5"
        stroke="currentColor"
        aria-hidden="true"
      >
        <path
          stroke-linecap="round"
          stroke-linejoin="round"
          d="m20.893 13.393-1.135-1.135a2.252 2.252 0 0 1-.421-.585l-1.08-2.16a.414.414 0 0 0-.663-.107.827.827 0 0 1-.812.21l-1.273-.363a.89.89 0 0 0-.738 1.595l.587.39c.59.395.674 1.23.172 1.732l-.2.2c-.212.212-.33.498-.33.796v.41c0 .409-.11.809-.32 1.158l-1.315 2.191a2.11 2.11 0 0 1-1.81 1.025 1.055 1.055 0 0 1-1.055-1.055v-1.172c0-.92-.56-1.747-1.414-2.089l-.655-.261a2.25 2.25 0 0 1-1.383-2.46l.007-.042a2.25 2.25 0 0 1 .29-.787l.09-.15a2.25 2.25 0 0 1 2.37-1.048l1.178.236a1.125 1.125 0 0 0 1.302-.795l.208-.73a1.125 1.125 0 0 0-.578-1.315l-.665-.332-.091.091a2.25 2.25 0 0 1-1.591.659h-.18c-.249 0-.487.1-.662.274a.931.931 0 0 1-1.458-1.137l1.411-2.353a2.25 2.25 0 0 0 .286-.76m11.928 9.869A9 9 0 0 0 8.965 3.525m11.928 9.868A9 9 0 1 1 8.965 3.525"
        />
      </svg>

      <p>Ładowanie...</p>
    </div>
    <app-root></app-root>
  </body>
</html>
