# Budowa i testy serwera gry na obu platformach (decyzja 6.5) oraz sprawdzenie, że
# wspólny schemat protobuf generuje się także dla klienta.
#
# Pipeline wchodzi razem z etapem E1 (decyzja 6.7), zanim pojawi się test determinizmu
# z §8 dokumentu architektury — bo to on jest prawdziwym powodem, żeby CI istniało,
# a dopisanie budowy C++ z vcpkg do gotowego pipeline'u po roku jest osobną robotą.
name: gameserver

on:
  push:
    branches: [main]
  pull_request:

jobs:
  windows:
    name: windows-ninja
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Przypnij vcpkg do baseline'u z manifestu
        shell: bash
        run: |
          baseline=$(grep -o '"builtin-baseline": "[^"]*"' gameserver/vcpkg.json | cut -d'"' -f4)
          git -C "$VCPKG_INSTALLATION_ROOT" fetch --depth 1 origin "$baseline"
          git -C "$VCPKG_INSTALLATION_ROOT" checkout --force --detach FETCH_HEAD
          echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> "$GITHUB_ENV"

      - name: Cache pakietów vcpkg
        uses: actions/cache@v4
        with:
          path: ~\AppData\Local\vcpkg\archives
          key: vcpkg-windows-${{ hashFiles('gameserver/vcpkg.json') }}
          restore-keys: vcpkg-windows-

      # Jeden krok, bo środowisko Visual Studio nie przechodzi między krokami, a Ninja
      # bez niego nie znajdzie kompilatora. Wersję VS wskazuje vswhere zamiast nazwy
      # generatora — „Visual Studio 17 2022" wpisane na sztywno przestaje działać w dniu,
      # w którym obraz runnera dostaje nowszy Visual Studio.
      - name: Budowa i testy
        shell: cmd
        working-directory: gameserver
        run: |
          set "VSWHERE=%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe"
          for /f "usebackq tokens=*" %%i in (`"%VSWHERE%" -latest -products * -property installationPath`) do call "%%i\VC\Auxiliary\Build\vcvars64.bat"
          cmake --preset windows-ninja || exit /b 1
          cmake --build --preset windows-ninja || exit /b 1
          ctest --preset windows-ninja || exit /b 1

  linux:
    name: linux-gcc
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Przypnij vcpkg do baseline'u z manifestu
        run: |
          baseline=$(grep -o '"builtin-baseline": "[^"]*"' gameserver/vcpkg.json | cut -d'"' -f4)
          git -C "$VCPKG_INSTALLATION_ROOT" fetch --depth 1 origin "$baseline"
          git -C "$VCPKG_INSTALLATION_ROOT" checkout --force --detach FETCH_HEAD
          echo "VCPKG_ROOT=$VCPKG_INSTALLATION_ROOT" >> "$GITHUB_ENV"

      - name: Cache pakietów vcpkg
        uses: actions/cache@v4
        with:
          path: ~/.cache/vcpkg/archives
          key: vcpkg-linux-${{ hashFiles('gameserver/vcpkg.json') }}
          restore-keys: vcpkg-linux-

      - name: Konfiguracja
        working-directory: gameserver
        run: cmake --preset linux-gcc

      - name: Budowa
        working-directory: gameserver
        run: cmake --build --preset linux-gcc

      - name: Testy
        working-directory: gameserver
        run: ctest --preset linux-gcc

  proto:
    name: codegen klienta
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Zależności
        working-directory: client
        run: npm ci

      # Schemat jest wspólny (D2), więc zepsuty musi zatrzymać budowę obu stron, a nie
      # tylko tej, którą akurat ktoś zbudował lokalnie.
      - name: Generowanie kodu z proto
        working-directory: client
        run: npm run proto:gen
